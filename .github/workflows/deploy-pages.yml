name: Build and Deploy FO Hacking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle game with esbuild
        run: npx --yes esbuild@0.25.0 src/browser.ts --bundle --minify --outfile=play/dist/esbuild/browser.js

      - name: Assemble static site
        run: |
          mkdir -p site/play
          cp index.html llms.txt robots.txt sitemap.xml og-image.png manifest.webmanifest .nojekyll site/
          cp -R play/. site/play/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
